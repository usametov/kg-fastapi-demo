# Template only - DO NOT apply this file as-is and never commit real values.
#
#   kubectl -n kg-demo create secret generic kg-fastapi-demo-secrets \
#     --from-literal=OPENAI_API_KEY="$(cat ~/.openai-key)" \
#     --from-literal=NEO4J_PASSWORD="$(openssl rand -hex 24)"
#
# The app reads plain environment variables only (pydantic-settings); it does
# not support the *_FILE convention, so mount-as-volume is not an option yet.
apiVersion: v1
kind: Secret
metadata:
  name: kg-fastapi-demo-secrets
  labels:
    app.kubernetes.io/name: kg-fastapi-demo
    app.kubernetes.io/part-of: kg-fastapi-demo
type: Opaque
stringData:
  # Required when LLM_MODEL starts with "openai/".
  OPENAI_API_KEY: "sk-REPLACE_ME"

  # Required: config.py defaults to "please-change-me", which Neo4j will reject
  # unless you actually configured that password.
  NEO4J_PASSWORD: "REPLACE_ME"

  # Only if Redis requires AUTH. If set here, remove REDIS_URL from the
  # ConfigMap: an explicit env var wins over envFrom, but keeping one source
  # of truth avoids surprises.
  # REDIS_URL: "redis://:REPLACE_ME@redis:6379/0"
