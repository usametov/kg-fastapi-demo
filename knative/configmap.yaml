apiVersion: v1
kind: ConfigMap
metadata:
  name: kg-fastapi-demo-config
  labels:
    app.kubernetes.io/name: kg-fastapi-demo
    app.kubernetes.io/part-of: kg-fastapi-demo
data:
  # --- process (app/config.py: app_name, environment, log_level) -----------
  # ENVIRONMENT is a Literal["dev","test","prod"] - no "staging" value exists.
  APP_NAME: "kg-fastapi-demo"
  ENVIRONMENT: "prod"
  LOG_LEVEL: "INFO"
  # HOST defaults to 0.0.0.0 and PORT is injected by Knative (from containerPort).
  # Do not set PORT here: Knative's own env var takes precedence over envFrom.

  # --- Neo4j: attached resource (config.py: neo4j_*) ----------------------
  # In-cluster Service from the README appendix, or any reachable endpoint.
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_DATABASE: "neo4j"
  # NEO4J_PASSWORD lives in the Secret.

  # --- LLM: attached resource (config.py: llm_model, llm_api_base, ...) ---
  LLM_MODEL: "openai/gpt-4o"
  # Any LiteLLM provider string works. For a local Ollama:
  # LLM_MODEL: "ollama/llama3"
  # LLM_API_BASE: "http://ollama:11434"
  EXTRACTION_MODEL: "gpt-4o"
  EMBEDDING_MODEL: "text-embedding-3-large"

  # --- Files (config.py: data_dir) ---------------------------------------
  # Baked into the image at /app/data. Neo4j additionally needs the same CSVs
  # in its own import dir for LOAD CSV "file:///..." (see README).
  DATA_DIR: "/app/data"

  # --- State + concurrency (config.py: state_backend, redis_url, ...) ----
  # Both are MANDATORY on Knative: in-memory state dies with the pod, and
  # JOB_RUNNER=inprocess loses a build when the API scales to zero.
  STATE_BACKEND: "redis"
  REDIS_URL: "redis://redis:6379/0"
  STATE_TTL_SECONDS: "86400"
  JOB_RUNNER: "worker"

  # --- Agent knobs borrowed from the notebooks ---------------------------
  SCHEMA_LOOP_MAX_ITERATIONS: "2"
  REVIEW_CHUNK_SEPARATOR: "---"
  ENTITY_SIMILARITY_THRESHOLD: "0.1"
